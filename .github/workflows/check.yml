name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  patterns:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      # every plugin skill with a references/patterns folder is checked
      - name: Structure, links and the any-type ban
        run: for d in ../plugins/*/skills/*/; do node check.mjs --dir "${d#../}" || exit 1; done
      - name: Code sketches compile (CSS via lightningcss, TS/TSX strict)
        run: for d in ../plugins/*/skills/*/; do NODE_PATH=./node_modules node check.mjs --sketches --dir "${d#../}" || exit 1; done
      - name: Plugin manifests are valid JSON
        working-directory: .
        run: for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
